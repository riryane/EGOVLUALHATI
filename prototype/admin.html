<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agency Portal (Demo)</title>
    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <style>
        .admin-header {
            padding: 18px 24px 8px;
        }
        .admin-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 20px;
            font-weight: 800;
            color: #0f172a;
        }
        .demo-badge {
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.5px;
            background: #fef3c7;
            color: #b45309;
            padding: 3px 8px;
            border-radius: 999px;
            text-transform: uppercase;
        }
        .admin-sub {
            font-size: 13px;
            color: #64748b;
            margin-top: 4px;
        }

        .app-card {
            background: #fff;
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            margin: 0 24px 14px;
        }
        .app-card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 4px;
        }
        .applicant {
            font-size: 15px;
            font-weight: 800;
            color: #0f172a;
        }
        .app-program {
            font-size: 13px;
            color: #334155;
            font-weight: 600;
            margin-top: 2px;
        }
        .app-meta {
            font-size: 12px;
            color: #64748b;
            margin-top: 2px;
        }
        .chip {
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 999px;
            white-space: nowrap;
        }
        .actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            flex-wrap: wrap;
        }
        .act-btn {
            flex: 1;
            min-width: 90px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            border: none;
            font-family: inherit;
            font-size: 12.5px;
            font-weight: 700;
            padding: 10px 8px;
            border-radius: 10px;
            cursor: pointer;
        }
        .act-btn:disabled { opacity: 0.45; cursor: default; }
        .act-approve { background: #ecfdf5; color: #059669; }
        .act-deny    { background: #fef2f2; color: #dc2626; }
        .act-info    { background: #fffbeb; color: #b45309; }
        .act-advance { background: #eff6ff; color: #1d4ed8; flex-basis: 100%; }
        .act-btn svg { width: 14px; height: 14px; }

        .filter-row {
            display: flex;
            gap: 8px;
            padding: 12px 24px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .filter-row::-webkit-scrollbar { display: none; }
        .f-pill {
            white-space: nowrap;
            border: 1px solid var(--border-color);
            background: #fff;
            font-family: inherit;
            font-size: 12.5px;
            font-weight: 700;
            color: #334155;
            padding: 8px 14px;
            border-radius: 20px;
            cursor: pointer;
        }
        .f-pill.active {
            background: var(--primary-color);
            border-color: var(--primary-color);
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="admin-header">
            <div class="admin-title" style="justify-content: space-between;">
                <span style="display: inline-flex; align-items: center; gap: 8px;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22" style="color: var(--primary-color);"><path d="M3 21h18"></path><path d="M5 21V7l7-4 7 4v14"></path><path d="M9 21v-6h6v6"></path></svg>
                    eTulong Agency Portal
                    <span class="demo-badge">Demo</span>
                </span>
                <button id="demo-reset" title="Demo only: restore all applications to the baseline state"
                    style="display: inline-flex; align-items: center; gap: 5px; border: 1.5px solid #ef4444; background: #fff; color: #ef4444; font-family: inherit; font-size: 11.5px; font-weight: 700; padding: 7px 12px; border-radius: 16px; cursor: pointer;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="13" height="13" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg>
                    Demo Reset
                </button>
            </div>
            <div class="admin-sub">Review citizen applications — approve, deny, or request additional information.</div>
        </div>

        <div style="padding: 10px 24px 0; position: relative;">
            <input type="text" id="admin-search" placeholder="Search by applicant or program"
                style="width: 100%; box-sizing: border-box; border: 1px solid var(--border-color); border-radius: 12px; padding: 11px 40px 11px 14px; font-family: inherit; font-size: 13.5px; color: #0f172a; outline: none;">
            <svg viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" width="17" height="17" style="position: absolute; right: 38px; top: 50%; transform: translateY(-30%);"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        </div>

        <div class="filter-row" id="admin-filters">
            <button class="f-pill active" data-status="all">All</button>
            <button class="f-pill" data-status="pending">Pending</button>
            <button class="f-pill" data-status="info_requested">Info Requested</button>
            <button class="f-pill" data-status="approved">Approved</button>
            <button class="f-pill" data-status="for_pickup">For Pick-up</button>
            <button class="f-pill" data-status="done">Done</button>
            <button class="f-pill" data-status="appealed">Appealed</button>
            <button class="f-pill" data-status="rejected">Rejected</button>
            <button class="f-pill" data-status="expired">Expired</button>
        </div>

        <div class="content-area" style="padding-bottom: 40px;">
            <div id="admin-list"></div>
        </div>

        <!-- Note modal (rejection reason / info request) -->
        <div id="note-modal" style="position: absolute; inset: 0; background: rgba(15, 23, 42, 0.55); z-index: 80; display: none; align-items: flex-end;">
            <div style="background: #fff; width: 100%; border-radius: 24px 24px 0 0; padding: 24px 24px 36px;">
                <div style="width: 40px; height: 4px; background: #e2e8f0; border-radius: 2px; margin: 0 auto 20px;"></div>
                <div id="note-modal-title" style="font-size: 17px; font-weight: 800; color: #0f172a; margin-bottom: 6px;"></div>
                <div id="note-modal-sub" style="font-size: 13px; color: #64748b; margin-bottom: 14px; line-height: 1.5;"></div>
                <textarea id="note-modal-input" rows="3" style="width: 100%; box-sizing: border-box; border: 1px solid var(--border-color); border-radius: 12px; padding: 12px 14px; font-family: inherit; font-size: 14px; color: #0f172a; outline: none; resize: none;"></textarea>
                <div id="note-modal-error" style="display: none; font-size: 12.5px; color: #dc2626; font-weight: 600; margin-top: 6px;">A message is required.</div>
                <button id="note-modal-submit" style="display: block; width: 100%; border: none; color: #fff; font-family: inherit; font-size: 15px; font-weight: 700; padding: 15px; border-radius: 12px; cursor: pointer; margin-top: 16px;"></button>
                <button id="note-modal-cancel" style="display: block; width: 100%; background: none; border: none; margin-top: 12px; font-family: inherit; font-size: 13.5px; font-weight: 700; color: #64748b; cursor: pointer;">Cancel</button>
            </div>
        </div>
    </div>

    <script type="module">
        // Agency-side demo page. Not linked from the citizen app — open
        // admin.html directly. Every decision updates the database and
        // notifies the citizen by SMS via eMessage.
        import { supabase } from './assets/js/supabase-client.js';
        import { sendSms } from './assets/js/emessage.js';
        import { evaluate } from './assets/js/eligibility.js';

        const listEl = document.getElementById('admin-list');
        const filtersEl = document.getElementById('admin-filters');

        const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
            ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

        const CHIP = {
            pending:        ['Pending',        '#b45309', '#fffbeb'],
            info_requested: ['Info Requested', '#b45309', '#fef3c7'],
            approved:       ['Approved',       '#1d4ed8', '#eff6ff'],
            for_pickup:     ['For Pick-up',    '#7c3aed', '#f5f3ff'],
            done:           ['Done',           '#059669', '#ecfdf5'],
            rejected:       ['Rejected',       '#dc2626', '#fef2f2'],
            expired:        ['Expired',        '#64748b', '#f1f5f9'],
            appealed:       ['Appealed',       '#0284c7', '#e0f2fe'],
        };

        const SMS = {
            approved:       (p) => `eGovPH: Good news! Your ${p} application has been APPROVED. We will notify you when it is ready for pick-up.`,
            rejected:       (p, note) => `eGovPH: We're sorry — your ${p} application was NOT APPROVED. Reason: ${note} You may re-apply after the cooldown period.`,
            info_requested: (p, note) => `eGovPH: Your ${p} application needs ADDITIONAL INFORMATION: ${note} Please open the eGovPH app to respond.`,
            for_pickup:     (p) => `eGovPH: Your ${p} benefit is READY FOR PICK-UP at the designated distribution point. Bring your Digital ID.`,
            done:           (p) => `eGovPH: Your ${p} application is now COMPLETED. Thank you for using eGovPH eTulong.`,
            expired:        (p) => `eGovPH: Your ${p} benefit cycle has ended. You are now eligible to APPLY AGAIN for the next cycle through the eGovPH app.`,
        };

        const fmtDate = (d) => new Date(d).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

        let apps = [];
        let activeFilter = 'all';
        let searchTerm = '';

        function render() {
            const visible = apps.filter(a => {
                if (activeFilter !== 'all' && a.status !== activeFilter) return false;
                if (searchTerm) {
                    const hay = `${a.users?.full_name || ''} ${a.assistance?.program_name || ''} ${a.assistance?.agency || ''}`.toLowerCase();
                    if (!hay.includes(searchTerm)) return false;
                }
                return true;
            });
            if (!visible.length) {
                listEl.innerHTML = '<p style="padding: 16px 24px; color: #64748b;">No applications in this view.</p>';
                return;
            }
            listEl.innerHTML = visible.map(a => {
                const [label, color, bg] = CHIP[a.status] || CHIP.pending;
                const decided = ['done', 'rejected', 'expired'].includes(a.status);
                const advance = a.status === 'approved' ? ['for_pickup', 'Mark as For Pick-up']
                              : ['done', 'rejected'].includes(a.status) ? ['expired', 'Reset Cycle — Allow Re-Application']
                              : null;

                const noteBlock = a.admin_note && ['rejected', 'info_requested', 'appealed'].includes(a.status) ? `
                    <div style="flex-basis: 100%; font-size: 12.5px; color: ${a.status === 'info_requested' ? '#b45309' : '#dc2626'}; background: ${a.status === 'info_requested' ? '#fffbeb' : '#fef2f2'}; border-radius: 10px; padding: 10px 12px; line-height: 1.5;">
                        <b>${a.status === 'info_requested' ? 'Info requested' : 'Rejection reason'}:</b> ${esc(a.admin_note)}
                    </div>` : '';

                const appealNote = a.status === 'appealed' && a.citizen_note ? `
                    <div style="flex-basis: 100%; font-size: 12.5px; color: #0369a1; background: #e0f2fe; border-radius: 10px; padding: 10px 12px; line-height: 1.5;">
                        <b>Citizen's appeal:</b> ${esc(a.citizen_note)}
                    </div>` : '';

                const u = a.users || {};
                // Eligibility computed for THIS applicant by the rules engine
                // (their profile + their other applications); falls back to the
                // program's seeded requirement list.
                const applicantApps = apps.filter(x => x.user_id === a.user_id);
                const computed = a.assistance ? evaluate(
                    a.assistance, u,
                    applicantApps.map(x => ({ status: x.status, assistance_id: x.assistance_id, assistance: x.assistance }))
                ) : null;
                const req = computed?.results || a.assistance?.requirements || [];

                // Documents: the snapshot the citizen SUBMITTED wins; otherwise
                // the program's catalog defaults.
                const docs = a.submitted_documents || a.assistance?.documents || [];
                const docsLabel = a.submitted_documents ? 'Documents (as submitted)' : 'Documents (program checklist)';
                const detailsBlock = `
                    <div class="citizen-details" data-id="${a.id}" style="display: none; flex-basis: 100%; background: #f8fafc; border-radius: 12px; padding: 14px; font-size: 12.5px; color: #334155; line-height: 1.7;">
                        <b style="color: #0f172a;">Applicant Information</b><br>
                        Name: <b>${esc(u.full_name)}</b><br>
                        Birth date: ${u.date_of_birth ? esc(u.date_of_birth) : '—'} • Phone: ${esc(u.phone || '—')}<br>
                        Email: ${esc(u.email || '—')}<br>
                        Address: ${esc(u.address || '—')}<br>
                        <b style="color: #0f172a; display: block; margin-top: 8px;">Eligibility${computed ? ` — ${computed.title}` : ''}</b>
                        ${req.map(r0 => `${r0.met ? '✓' : '✗'} ${esc(r0.text)}`).join('<br>') || '—'}
                        <b style="color: #0f172a; display: block; margin-top: 8px;">${docsLabel}</b>
                        ${docs.map(d => `${d.verified ? '✓ verified' : '◻ not submitted'} — ${esc(d.name)}${(d.via || d.source) ? ' (' + esc(d.via || d.source) + ')' : ''}`).join('<br>') || 'No documents required'}
                    </div>`;

                // For Pick-up: two-factor claim — a fresh SMS code confirms
                // the claimant possesses the registered mobile number.
                const pickupBlock = a.status === 'for_pickup' ? `
                    <div style="flex-basis: 100%; background: #f8fafc; border: 1px dashed var(--border-color); border-radius: 12px; padding: 12px;">
                        <div style="font-size: 11.5px; font-weight: 700; color: #64748b; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.4px;">Pick-up verification</div>
                        <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                            <button class="act-btn act-advance send-code-btn" data-id="${a.id}" style="flex-basis: auto; flex: 1;">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 2L11 13"></path><path d="M22 2l-7 20-4-9-9-4 20-7z"></path></svg>
                                ${a.claim_code ? 'Resend Code' : 'Send Verification Code'}
                            </button>
                            <input class="code-input" data-id="${a.id}" maxlength="6" inputmode="numeric" placeholder="6-digit code"
                                style="flex: 1; min-width: 110px; border: 1px solid var(--border-color); border-radius: 10px; padding: 10px 12px; font-family: inherit; font-size: 13px; font-weight: 700; letter-spacing: 2px; outline: none;">
                            <button class="act-btn act-approve confirm-code-btn" data-id="${a.id}" style="flex-basis: auto; flex: 1;">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"></polyline></svg>
                                Confirm Pick-up
                            </button>
                        </div>
                        <div class="code-feedback" data-id="${a.id}" style="font-size: 12px; font-weight: 600; margin-top: 8px; display: none;"></div>
                    </div>` : '';
                return `
                <div class="app-card">
                    <div class="app-card-top">
                        <div>
                            <div class="applicant">${esc(a.users?.full_name || 'Unknown Citizen')}</div>
                            <div class="app-program">${esc(a.assistance?.program_name || '')}</div>
                            <div class="app-meta">${esc(a.assistance?.agency || '')} • Applied ${fmtDate(a.applied_at)}</div>
                        </div>
                        <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 6px;">
                            <span class="chip" style="color: ${color}; background: ${bg};">${label}</span>
                            <button class="view-details-btn" data-id="${a.id}" style="border: none; background: none; font-family: inherit; font-size: 11.5px; font-weight: 700; color: var(--primary-color); cursor: pointer; padding: 0;">View Details</button>
                        </div>
                    </div>
                    <div class="actions">
                        ${detailsBlock}
                        ${noteBlock}
                        ${appealNote}
                        <button class="act-btn act-approve" data-id="${a.id}" data-action="approved" ${decided || a.status === 'approved' || a.status === 'for_pickup' ? 'disabled' : ''}>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"></polyline></svg>
                            Approve
                        </button>
                        <button class="act-btn act-deny" data-id="${a.id}" data-action="rejected" ${decided ? 'disabled' : ''}>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                            Deny
                        </button>
                        <button class="act-btn act-info" data-id="${a.id}" data-action="info_requested" ${decided || a.status !== 'pending' ? 'disabled' : ''}>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                            Request Info
                        </button>
                        ${advance ? `
                        <button class="act-btn act-advance" data-id="${a.id}" data-action="${advance[0]}">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="9 18 15 12 9 6"></polyline></svg>
                            ${advance[1]}
                        </button>` : ''}
                        ${pickupBlock}
                    </div>
                </div>`;
            }).join('');
        }

        async function load() {
            const { data, error } = await supabase
                .from('applications')
                .select('id, status, applied_at, admin_note, citizen_note, claim_code, claim_code_expires_at, submitted_documents, user_id, assistance_id, users ( full_name, phone, date_of_birth, address, email ), assistance ( id, program_name, agency, category, amount_label, requirements, documents, rules )')
                .order('applied_at', { ascending: false });
            if (error) {
                console.error(error);
                listEl.innerHTML = '<p style="padding: 16px 24px; color: #64748b;">Could not load applications.</p>';
                return;
            }
            apps = data;
            render();
        }

        const CODE_TTL_MS = 5 * 60 * 1000;

        function feedback(appId, msg, ok) {
            const el = listEl.querySelector(`.code-feedback[data-id="${appId}"]`);
            if (!el) return;
            el.textContent = msg;
            el.style.color = ok ? '#059669' : '#dc2626';
            el.style.display = 'block';
        }

        async function sendClaimCode(app, btn) {
            btn.disabled = true;
            const code = String(Math.floor(100000 + Math.random() * 900000));
            const expires = new Date(Date.now() + CODE_TTL_MS).toISOString();
            const { error } = await supabase.from('applications')
                .update({ claim_code: code, claim_code_expires_at: expires })
                .eq('id', app.id);
            if (error) {
                console.error(error);
                feedback(app.id, 'Could not generate a code. (Has the claim_code SQL been run?)', false);
                btn.disabled = false;
                return;
            }
            app.claim_code = code;
            app.claim_code_expires_at = expires;

            // The code is always shown on-screen FOR DEMONSTRATION PURPOSES;
            // the SMS is routed to the demo phone (see emessage.js).
            const phone = app.users?.phone || '';
            const e164 = '+63' + phone.replace(/\D/g, '').slice(-10);
            try {
                await sendSms(e164, `eGovPH: Your eTulong pick-up verification code is ${code}. Read it to the officer to claim your benefit. Valid for 5 minutes.`);
                feedback(app.id, `Code: ${code} (shown for demo) — SMS sent.`, true);
            } catch (err) {
                console.warn('Claim-code SMS failed', err);
                feedback(app.id, `Code: ${code} (shown for demo) — SMS service unavailable.`, true);
            }
            btn.disabled = false;
            btn.innerHTML = btn.innerHTML.replace('Send Verification Code', 'Resend Code');
        }

        async function confirmPickup(app, btn) {
            const input = listEl.querySelector(`.code-input[data-id="${app.id}"]`);
            const entered = (input?.value || '').trim();
            if (entered.length !== 6) { feedback(app.id, 'Enter the 6-digit code from the citizen.', false); return; }

            // Check against the freshest DB state.
            const { data: row } = await supabase.from('applications')
                .select('claim_code, claim_code_expires_at').eq('id', app.id).single();
            if (!row?.claim_code) { feedback(app.id, 'No code has been sent yet.', false); return; }
            if (new Date(row.claim_code_expires_at) < new Date()) { feedback(app.id, 'Code expired — send a new one.', false); return; }
            if (entered !== row.claim_code) { feedback(app.id, 'Incorrect code — verify with the citizen.', false); return; }

            btn.disabled = true;
            const { error } = await supabase.from('applications')
                .update({ status: 'done', claim_code: null, claim_code_expires_at: null, updated_at: new Date().toISOString() })
                .eq('id', app.id);
            if (error) { console.error(error); btn.disabled = false; return; }

            app.status = 'done';
            render();

            const phone = app.users?.phone || '';
            const e164 = '+63' + phone.replace(/\D/g, '').slice(-10);
            sendSms(e164, SMS.done(app.assistance?.program_name || 'ayuda'))
                .catch(err => console.warn('Receipt SMS failed', err));
        }

        listEl.addEventListener('click', async (e) => {
            const sendBtn = e.target.closest('.send-code-btn');
            if (sendBtn) {
                const app = apps.find(a => a.id === sendBtn.dataset.id);
                if (app) sendClaimCode(app, sendBtn);
                return;
            }
            const confirmBtn = e.target.closest('.confirm-code-btn');
            if (confirmBtn) {
                const app = apps.find(a => a.id === confirmBtn.dataset.id);
                if (app) confirmPickup(app, confirmBtn);
                return;
            }

            const detailsBtn = e.target.closest('.view-details-btn');
            if (detailsBtn) {
                const panel = listEl.querySelector(`.citizen-details[data-id="${detailsBtn.dataset.id}"]`);
                if (panel) {
                    const open = panel.style.display !== 'none';
                    panel.style.display = open ? 'none' : 'block';
                    detailsBtn.textContent = open ? 'View Details' : 'Hide Details';
                }
                return;
            }

            const btn = e.target.closest('.act-btn');
            if (!btn || btn.disabled) return;
            const app = apps.find(a => a.id === btn.dataset.id);
            const next = btn.dataset.action;
            if (!app || !next) return;

            // Deny and Request Info require a message to the citizen.
            if (next === 'rejected' || next === 'info_requested') {
                openNoteModal(app, next);
                return;
            }
            applyStatus(app, next, null);
        });

        async function applyStatus(app, next, note) {
            const patch = { status: next, updated_at: new Date().toISOString() };
            if (note !== undefined) patch.admin_note = note;
            if (app.status === 'appealed') patch.citizen_note = null;
            const { error } = await supabase.from('applications').update(patch).eq('id', app.id);
            if (error) { console.error(error); return; }

            app.status = next;
            app.admin_note = note ?? app.admin_note;
            render();

            // Notify the citizen by SMS (fire-and-forget).
            const phone = app.users?.phone;
            if (phone && SMS[next]) {
                const e164 = '+63' + phone.replace(/\D/g, '').slice(-10);
                sendSms(e164, SMS[next](app.assistance?.program_name || 'ayuda', note || ''))
                    .catch(err => console.warn('Status SMS failed', err));
            }
        }

        // ---- note modal (rejection reason / info request) ----
        const noteModal = document.getElementById('note-modal');
        const noteInput = document.getElementById('note-modal-input');
        const noteError = document.getElementById('note-modal-error');
        let noteTarget = null;

        function openNoteModal(app, action) {
            noteTarget = { app, action };
            const isReject = action === 'rejected';
            document.getElementById('note-modal-title').textContent = isReject ? 'Reason for Rejection' : 'Request Additional Information';
            document.getElementById('note-modal-sub').textContent = isReject
                ? 'This reason is shown to the citizen and included in the SMS notification.'
                : 'Describe what the citizen must provide. They can respond from the app.';
            noteInput.placeholder = isReject
                ? 'e.g. Income exceeds the program threshold based on submitted records.'
                : 'e.g. Please provide a clearer photo of your Barangay Certificate.';
            const submit = document.getElementById('note-modal-submit');
            submit.textContent = isReject ? 'Reject Application' : 'Send Request';
            submit.style.background = isReject ? '#dc2626' : '#b45309';
            noteInput.value = '';
            noteError.style.display = 'none';
            noteModal.style.display = 'flex';
            setTimeout(() => noteInput.focus(), 100);
        }

        document.getElementById('note-modal-submit').addEventListener('click', () => {
            const note = noteInput.value.trim();
            if (!note) { noteError.style.display = 'block'; return; }
            noteModal.style.display = 'none';
            applyStatus(noteTarget.app, noteTarget.action, note);
        });
        document.getElementById('note-modal-cancel').addEventListener('click', () => noteModal.style.display = 'none');
        noteModal.addEventListener('click', (e) => { if (e.target === noteModal) noteModal.style.display = 'none'; });

        document.getElementById('admin-search').addEventListener('input', (e) => {
            searchTerm = e.target.value.trim().toLowerCase();
            render();
        });

        filtersEl.addEventListener('click', (e) => {
            const pill = e.target.closest('.f-pill');
            if (!pill) return;
            filtersEl.querySelectorAll('.f-pill').forEach(p => p.classList.remove('active'));
            pill.classList.add('active');
            activeFilter = pill.dataset.status;
            render();
        });

        // DEMO ONLY: wipe every application and restore the baseline
        // sample history so the demo can be re-run from scratch.
        document.getElementById('demo-reset').addEventListener('click', async (e) => {
            if (!confirm('DEMO RESET: delete ALL applications (applied, approved, claimed - everything)? Submitted document verifications are kept.')) return;
            const btn = e.currentTarget;
            btn.disabled = true;
            btn.textContent = 'Resetting…';
            try {
                // Wipe every application. Document verifications (citizen-side
                // captures) are untouched by design.
                await supabase.from('applications').delete().gte('applied_at', '1970-01-01');
                await load();
            } catch (err) {
                console.error('Demo reset failed', err);
            }
            btn.disabled = false;
            btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="13" height="13" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg> Demo Reset';
        });

        load();
    </script>
</body>
</html>
